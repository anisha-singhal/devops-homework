# The image's baked-in nginx.conf proxies to http://backend:8000. That name
# resolves under Docker Compose, where the service IS called "backend", but
# the Helm chart names the Kubernetes Service "taskboard-taskboard-backend",
# so nginx fails at startup with:
#
#   [emerg] host not found in upstream "backend"
#
# Overriding the file through a ConfigMap is the Kubernetes-native fix: no
# image rebuild, and the environment-specific value lives in the manifest
# rather than in the image.
apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-nginx-conf
  namespace: taskboard
data:
  default.conf: |
    server {
      listen 80;
      server_name _;
      root /usr/share/nginx/html;
      index index.html;

      location / {
        try_files $uri $uri/ /index.html;
      }

      location /api/ {
        proxy_pass http://taskboard-taskboard-backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      }

      location /health {
        proxy_pass http://taskboard-taskboard-backend:8000/health;
      }
    }
