server {
    listen 80;

    location / {
        root /usr/share/nginx/html;
        index index.html;
    }

    # "backend" resolves via Docker's embedded DNS on frontend_net.
    # The frontend has no route to the database at all.
    location /api {
        proxy_pass http://backend:5000/;
    }

    # read-only readiness probe
    location /health {
        proxy_pass http://backend:5000/health;
    }
}
