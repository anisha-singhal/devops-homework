# MetalLB gives a bare-metal / kind cluster the missing piece: a controller that
# watches for type=LoadBalancer services and actually assigns an external IP.
# The pool must sit inside kind's docker network (172.20.0.0/16) so the host can route to it.
apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: kind-pool
  namespace: metallb-system
spec:
  addresses:
    - 172.20.255.200-172.20.255.250
---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: kind-l2
  namespace: metallb-system
spec:
  ipAddressPools:
    - kind-pool
